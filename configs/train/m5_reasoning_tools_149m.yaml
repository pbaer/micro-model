# M5 (tools): reasoning SFT where every arithmetic step is a tool call (sandboxed Python; see docs/design.md).
#   <|think|>... 12 x 2 = <|tool_call|>python: print(12*2)<|/tool_call|><|tool_result|>24<|/tool_result|>24 pages ...<|/think|>#### 42<|end|>
# Loss on the think text and the calls; tool results are masked (the harness writes them at inference).
# Data: GSM8K train with its own <<a*b=c>> annotations converted to calls, the 682 MetaMathQA rows that carry
# annotations, and 40K templated traces with calls (slm.rl.synth --tools). The GSM8K *test* split only feeds
# validation loss here and is never trained on.
run_name: m5_reasoning_tools_149m
tokenizer_dir: C:\slm-data\tokenizer\v1
model_file: configs/model/base_149m.yaml
init_from: runs/m4_sft_149m/checkpoints/final.pt
data:
  kind: sft
  sft_root: C:\slm-data\sft\v1
  mixture:
    synthetic-reasoning-tools: 0.40
    gsm8k-tools: 0.50
    metamathqa-tools: 0.10
  seq_len: 1024
  val_tokens: 1000000
  extra_val_mixture: {fineweb-edu: 0.8, cosmopedia: 0.1, finemath: 0.05, python-edu: 0.03, stack-edu-shell: 0.02}
optim:
  lr: 2.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  type: cosine
  epochs: 3.0
  warmup_tokens: 2000000
  min_lr_ratio: 0.1
batch:
  microbatch: 16
  tokens_per_update: 131072
runtime:
  compile: true
  sdpa_backend: cudnn
  seed: 0
  log_every_updates: 10
ckpt:
  every_minutes: 15
eval:
  every_tokens: 10000000
  gen_every_tokens: 20000000
  gen_max_new_tokens: 160
  report_every_minutes: 10
  prompts:
    - "<|user|>Julie reads 12 pages today and twice as many tomorrow. How many pages in total?\nThink step by step, then give the final answer on its own line as '#### <number>'.<|end|><|assistant|><|think|>"
notes: "Tool-use reasoning SFT (calculator). Evaluate with slm.eval.reasoning --tools --gsm8k -1."
