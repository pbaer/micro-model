# M9 stage C, run 5: the chat anchor, plus the out-of-mix math families trained in the mix.
#
# Runs 3 and 4 settled the anchor: a verifiable `plain` chat reward recovers judged facts (2.00 -> 2.79 -> 3.75)
# and drives tool misfire to 0.14 -> 0.00, across two seeds and two schemes. What they also showed is where
# the cost lands: tool use on `algebra`, `arith2` and `word` -- families that were NOT in the RL mix -- fell
# (algebra 0.96 -> 0.71 -> 0.45). That is generalisation: the anchor's "short question -> do not call" spreads
# to short questions with numbers. Run 4 tried to counter it with a wider tool-reward gap (`tool_strict`) and
# made it worse, because a reward change inside the mix cannot reach families outside it.
#
# So run 5 puts them inside. `algebra`, `arith2` and `word` join the mix under the ordinary `tool` scheme, so
# "short question with numbers -> call the sandbox" is trained rather than inferred. Base config is run 3's
# (scheme `tool`, not run 4's `tool_strict`). The held-out set now contains these families too, so its level
# is not comparable to earlier runs; the post-run reasoning eval is the comparison.
#
# Weights: chat 3 / constraints 4 / gsm8k 3 / pytool_numbers 2 / pytool_declared 1 / algebra 2 / arith2 1 /
# word 1 of 17. The anchor keeps 3 draws (18%); its effect was robust at 23% and the probe on stage B put
# algebra at 0.92 groups-with-spread, arith2 0.43, word 0.50, so these carry gradient.
run_name: m9_rl5_336m
tokenizer_dir: C:\slm-data\tokenizer\v1
model_file: configs/model/base_336m.yaml
model:
  max_seq_len: 4096  # the rollout KV cache is sized from this; the run is a 4K run
init_from: runs/m9_tool4_336m/checkpoints/final.pt
tools: true
max_tool_calls: 6
tasks: [chat, chat, chat, constraints, constraints, constraints, constraints, gsm8k, gsm8k, gsm8k, pytool_numbers, pytool_numbers, pytool_declared, algebra, algebra, arith2, word]
n_train_prompts: 6000
n_heldout_prompts: 96   # every eval greedy-decodes all of them; pytool prompt lengths vary, so batches are small
group_size: 6
prompts_per_step: 8
max_new_tokens: 512     # a tool call, its result, and a written answer all have to fit
temperature: 0.8
top_p: 0.95
think_required: true
reward_scheme: tool     # default: 1.0 correct AND the answer came out of a Python call, 0.5 correct without one
reward_schemes:
  gsm8k: tool
  pytool: tool          # matches every pytool_* family by its group prefix
  constraints: fraction # the share of instructions satisfied; there is no tool to use here
  chat: plain           # a plain chat answer with no tool call; the anchor against tool-and-terse drift
  # algebra / arith2 / word take the run default (`tool`): 1.0 with a call, 0.5 without, 0 wrong
lr: 4.0e-6              # try 1 (2026-09-22) ran 75 steps at 8e-7 and moved the policy almost not at all:
                        # KL to the reference averaged 0.00028 against the 0.15 budget -- 0.2% of it -- with
                        # reward flat over 50 steps and held-out 0.250 -> 0.271 (+2 prompts of 96, inside
                        # noise). The KL budget, not the learning rate, is the safety mechanism here, and it
                        # was going unused. 5x lr should land KL near 0.008, still ~20x under the limit.
weight_decay: 0.0
grad_clip: 1.0
clip_eps: 0.2
use_ratio: true
kl_coef: 0.05           # m6 try1 collapsed at 0.01 (entropy 0.8 -> 5 by step 150)
kl_kind: k3
normalize_std: true
ppo_epochs: 1
microbatch: 2
total_steps: 250
entropy_stop: 2.5       # collapse guards: stop, checkpoint, keep best.pt -- judged on `guard_window` means
kl_stop: 0.15
guard_window: 10        # try 1 was stopped at step 75 by ONE step touching entropy 2.54. Over its 69 steps
                        # entropy ran 0.00-2.54, stdev 0.63, with no trend (corr with step -0.13) while KL
                        # stayed at 0.0003: noise from a 24-rollout step, not a diverging policy. Collapse is
                        # sustained (m6 try1 went 0.8 -> 5 and stayed), so the window mean is what is tested.
eval_every_steps: 50
eval_max_new_tokens: 512
ckpt_every_minutes: 15
report_every_minutes: 5
seed: 12
notes: "RL over the full tool subset plus instruction constraints. Per-family schemes (tool / fraction). Use best.pt (held-out) for evals; check tool_use_rate, answer_from_tool_rate and score_mean per family in the rollout dumps."
