# M7 stage 1b: close the last 8K retrieval gap (needles in the first ~10% of a full 8K context).
# Stage 1 reached effective context 6000: 100% through 4K, 88-100% at 6K, but 0-6% for needles at depth
# 0-0.1 of 8K (near-miss copies: the last digits wrong). Its retrieval data was log-uniform over 512-16K
# tokens, so few documents exercised full-length recall from the start. This stage continues from the
# stage-1 checkpoint with `synth-retrieval-8k`: documents of 3K-8K tokens, half of the facts in the first
# 15% (slm.data.synth_retrieval --early-frac 0.5). Gate to 16K unchanged: needle min-depth >= 80% at 1K..8K.
run_name: m7_ctx8k_retrieval2_149m
tokenizer_dir: C:\slm-data\tokenizer\v1
model_file: configs/model/base_149m.yaml
model:
  loss_chunk_size: 4096
init_from: runs/m7_ctx8k_retrieval_149m/checkpoints/final.pt
data:
  tokenized_root: C:\slm-data\tokenized\v1
  mixture: {synth-retrieval-8k: 0.20, synth-retrieval: 0.05, fineweb-edu-long: 0.30, fineweb-edu-b: 0.30, cosmopedia: 0.05, finemath: 0.04, python-edu: 0.04, stack-edu-shell: 0.02}
  seq_len: 8192
  val_tokens: 2000000
  extra_val_mixture: {fineweb-edu-b: 0.8, cosmopedia: 0.1, finemath: 0.05, python-edu: 0.03, stack-edu-shell: 0.02}
optim:
  lr: 5.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  type: cosine
  total_tokens: 300000000
  warmup_tokens: 5000000
  min_lr_ratio: 0.1
batch:
  microbatch: 2
  tokens_per_update: 262144
runtime:
  compile: true
  sdpa_backend: cudnn
  log_every_updates: 10
ckpt:
  every_minutes: 15
eval:
  every_tokens: 50000000
  gen_every_tokens: 100000000
  report_every_minutes: 10
  prompts: ["The history of the Roman Empire begins"]
  needle_lengths: [2048, 4096, 6000, 8000]
  needle_depths: [0.0, 0.1, 0.25, 0.5, 1.0]
  needle_n: 4
  needle_source: fineweb-edu-b
milestone_tokens: 100000000
notes: "Stage 1b of the context curriculum: targeted at early-depth needles at 8K. ~2 h at 42K tok/s."
