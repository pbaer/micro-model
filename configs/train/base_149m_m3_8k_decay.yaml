# M3b: final phase at 8K context on long-document-upsampled data, with the WSD decay (last 60%).
# ~800M tokens: 40% stable at 8K, then linear decay to 10% LR. Produces the 8K base checkpoint.
run_name: m3_base_149m_8k
tokenizer_dir: C:\slm-data\tokenizer\v1
model_file: configs/model/base_149m.yaml
model: {loss_chunk_size: 4096}
init_from: runs/m3_base_149m_stable/checkpoints/final.pt
data:
  tokenized_root: C:\slm-data\tokenized\v1
  mixture: {fineweb-edu-long: 0.45, fineweb-edu: 0.35, cosmopedia: 0.08, finemath: 0.05, python-edu: 0.05, stack-edu-shell: 0.02}
  seq_len: 8192
  val_tokens: 4000000
optim: {lr: 5.0e-4, betas: [0.9, 0.95], weight_decay: 0.1, grad_clip: 1.0}
schedule: {type: wsd, total_tokens: 800000000, warmup_tokens: 5000000, min_lr_ratio: 0.1, decay_frac: 0.6}
batch: {microbatch: 4, tokens_per_update: 262144}
runtime: {compile: true, sdpa_backend: cudnn, seed: 2, log_every_updates: 10}
ckpt: {every_minutes: 15}
eval:
  every_tokens: 50000000
  gen_every_tokens: 100000000
  gen_max_new_tokens: 96
  report_every_minutes: 10
  prompts: ["The capital of France is", "def is_prime(n):\n    ", "Question: What is 12 + 7?\nAnswer:", "Photosynthesis is the process by which plants"]
milestone_tokens: 100000000
notes: "Requires fineweb-edu-long (prepare --min-doc-tokens 4096 --name fineweb-edu-long). Microbatch from the 8K benchmark."
