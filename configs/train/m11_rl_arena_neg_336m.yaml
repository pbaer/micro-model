# M11 take 3 RL: from the arena SFT with its negative case; plain-chat draws doubled (3 -> 6 of 36); 150 steps,
# snapshots every 25 (results §33). The original header follows.
#
# M11: M10's RL mix plus arena robot turns under fair prompts (slm.rl.arena; results §29 found that M10 cannot play the
# arena unless the question spells out the call). One task = one robot's turn: every tool declared (or the turn's tool
# named, its argument left to the robot), the situation in plain words, and the reward from its first tool call (1.0
# right tool + right fact / a step that really closes or opens the distance; 0.25 a real step the wrong way; 0 else).
# Four task families train (key_door, relay, tag, gold_rush, 2 draws each of 33, ~24%); triangulate and team_relay are
# held out and checked afterwards with the probe and whole episodes. M10's 25 draws stay as they were, so chat, tools
# and reasoning keep their anchor. Tries 1-3 (runs/m11_rl_arena_336m_try1..3) started from M10: try 1 farmed 0.25 with
# move("pen"), try 2 with say("ruler") (partial credit for a wrong argument, now 0), and try 3, clean, earned 0.07 a turn
# after 50 steps; so this starts from the arena SFT (m11_arena_sft_336m), which is also the KL reference.
run_name: m11_rl_arena_neg_336m
tokenizer_dir: C:\slm-data\tokenizer\v1
model_file: configs/model/base_336m.yaml
model:
  max_seq_len: 4096
init_from: runs/m11_arena_sft_neg_336m/checkpoints/final.pt  # the arena SFT with its negative case
tools: true
max_tool_calls: 6
tasks: [chat, chat, chat, chat, chat, chat, constraints, constraints, constraints, constraints, gsm8k, gsm8k, gsm8k, pytool_numbers, pytool_numbers, pytool_declared, algebra, algebra, arith2, word, select, select, select, recall, recall, revise, revise, sysrule,
        arena_key_door, arena_key_door, arena_relay, arena_relay, arena_tag, arena_tag, arena_gold_rush, arena_gold_rush]
n_train_prompts: 6000
n_heldout_prompts: 128  # ~31 arena turns among them; per-family scores are logged (heldout_fam_*)
group_size: 6
prompts_per_step: 8
max_new_tokens: 512
temperature: 0.8
top_p: 0.95
think_required: true
reward_scheme: tool
reward_schemes:
  gsm8k: tool
  pytool: tool
  constraints: fraction
  chat: plain
  select: binary
  recall: plain
  revise: fraction
  sysrule: fraction
  arena: fraction       # slm.rl.arena.arena_verdict: 1.0 / 0.25 / 0 from the first tool call
lr: 4.0e-6
weight_decay: 0.0
grad_clip: 1.0
clip_eps: 0.2
use_ratio: true
kl_coef: 0.05
kl_kind: k3
normalize_std: true
ppo_epochs: 1
microbatch: 2
total_steps: 150        # §32: instruction following was home by step 100 and the movement skill gone by 200
entropy_stop: 2.5
kl_stop: 0.15
guard_window: 10
eval_every_steps: 25    # a snapshot every 25 steps: the checkpoint is chosen by measurement (§32)
eval_max_new_tokens: 512
ckpt_every_minutes: 15
report_every_minutes: 5
seed: 16
notes: "M10 + arena robot turns (fair prompts). Gate: heldout_fam_arena_* up, the other families flat; then the probe and whole fair-prompt episodes incl. the held-out triangulate / team_relay, and the standard evals against M10."
