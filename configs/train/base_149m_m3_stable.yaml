# M3a: continue the 2K stable phase from the M2 pre-decay snapshot (WSD keeps LR flat, so this is a
# straight continuation). Total counts from this run's start; ~3.4B more tokens at 2K.
run_name: m3_base_149m_stable
tokenizer_dir: C:\slm-data\tokenizer\v1
model_file: configs/model/base_149m.yaml
init_from: runs/m2_base_149m_1b/checkpoints/snap_800M.pt
data:
  tokenized_root: C:\slm-data\tokenized\v1
  mixture: {fineweb-edu: 0.80, cosmopedia: 0.10, finemath: 0.05, python-edu: 0.03, stack-edu-shell: 0.02}
  seq_len: 2048
  val_tokens: 4000000
optim: {lr: 5.0e-4, betas: [0.9, 0.95], weight_decay: 0.1, grad_clip: 1.0}
schedule: {type: constant, total_tokens: 3400000000, warmup_tokens: 10000000}
batch: {microbatch: 16, tokens_per_update: 262144}
runtime: {compile: true, sdpa_backend: cudnn, seed: 1, log_every_updates: 10}
ckpt: {every_minutes: 15}
eval:
  every_tokens: 100000000
  gen_every_tokens: 200000000
  gen_max_new_tokens: 96
  report_every_minutes: 10
  prompts: ["The capital of France is", "def is_prime(n):\n    ", "Question: What is 12 + 7?\nAnswer:", "Photosynthesis is the process by which plants"]
milestone_tokens: 100000000
notes: "M3a stable phase. Data note: fineweb sample-10BT has ~3B tokens tokenized; more files needed beyond ~2 epochs."
