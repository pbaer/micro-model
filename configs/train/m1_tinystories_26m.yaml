# M1 sanity run: 26M model on TinyStories. Purpose: validate the whole pipeline cheaply.
run_name: m1_tinystories_26m
tokenizer_dir: C:\slm-data\tokenizer\v1
model_file: configs/model/sanity_26m.yaml
data:
  tokenized_root: C:\slm-data\tokenized\v1
  mixture: {tinystories: 1.0}
  seq_len: 1024          # TinyStories docs are ~200-300 tokens; 1K windows hold several stories
  val_tokens: 2000000
optim:
  lr: 1.0e-3             # small model tolerates a higher LR
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  type: cosine
  total_tokens: 600000000   # ~1.3 epochs of TinyStories (~470M tokens)
  warmup_tokens: 10000000
  min_lr_ratio: 0.1
batch:
  microbatch: 32
  tokens_per_update: 131072  # 32 x 1024 x 4 accum = 128K tokens/update
runtime:
  compile: true
  sdpa_backend: cudnn
  seed: 0
  log_every_updates: 10
ckpt:
  every_minutes: 10
eval:
  every_tokens: 25000000
  gen_every_tokens: 50000000
  gen_max_new_tokens: 120
  gen_temperature: 0.8
  gen_top_p: 0.95
  report_every_minutes: 5
  prompts:
    - "Once upon a time, there was a little girl named Lily. She loved to"
    - "Tom and his dog went to the park. Suddenly,"
    - "The sun was shining and the birds were singing. Ben looked out the window and saw"
    - "One day, a big red ball rolled down the hill and"
    - "Mom said, \"Do not touch the hot stove.\" But Tim"
milestone_tokens: 50000000
notes: "M1: validate tokenizer, packing, model, loss, ckpt/resume, generation, logging, throughput."
